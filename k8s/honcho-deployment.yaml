# Optional self-hosted Honcho memory service. API, deriver, and local embedding
# sidecar share one pod so migrations run before any of them serve traffic and
# the embedding path stays on localhost. It starts at zero replicas in the
# base kustomization; use k8s/honcho-enable.yaml to enable it deliberately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openexecutive-honcho
  labels:
    app.kubernetes.io/name: openexecutive-honcho
    app.kubernetes.io/component: memory
    app.kubernetes.io/part-of: openexecutive
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: openexecutive-honcho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openexecutive-honcho
        app.kubernetes.io/component: memory
        app.kubernetes.io/part-of: openexecutive
    spec:
      serviceAccountName: openexecutive
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: migrate
          image: ghcr.io/sykesey/openexecutive-honcho
          command:
            - sh
            - -c
            - python scripts/provision_db.py && python scripts/configure_embeddings.py --yes
          envFrom:
            - secretRef:
                name: openexecutive-honcho-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: api
          image: ghcr.io/sykesey/openexecutive-honcho
          command: ["fastapi", "run", "--host", "0.0.0.0", "src/main.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: openexecutive-honcho-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: deriver
          image: ghcr.io/sykesey/openexecutive-honcho
          command: ["python", "-m", "src.deriver"]
          envFrom:
            - secretRef:
                name: openexecutive-honcho-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
        - name: embed
          image: ghcr.io/sykesey/openexecutive-honcho
          command: ["uvicorn", "embed_server:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
          ports:
            - name: embed-http
              containerPort: 8001
          envFrom:
            - secretRef:
                name: openexecutive-honcho-secrets
          startupProbe:
            httpGet:
              path: /health
              port: embed-http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: embed-http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: embed-http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
