# Not included in kustomization.yaml: select the ingress class, hostname, and
# TLS issuer for your cluster, then apply this file separately.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openexecutive-ui
  namespace: openexecutive
spec:
  ingressClassName: nginx
  rules:
    - host: openexecutive.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openexecutive-ui
                port:
                  name: http
